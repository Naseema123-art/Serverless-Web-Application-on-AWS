<head>
  <style>
    input {
      color: #B2E6FF;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 20px;
      margin-left: 20px;
    }
  </style>
  <script>
    function callAPI(firstName, lastName) {
      var myHeaders = new Headers();
      myHeaders.append("Content-Type", "application/json");
      var raw = JSON.stringify({ "firstName": firstName, "lastName": lastName });
      var requestOptions = {
        method: 'POST',
        headers: myHeaders,
        body: raw,
        redirect: 'follow'
      };

      fetch(https://l17urhrkpc.execute-api.us-east-1.amazonaws.com/devop)                                                                     
        .then(response => response.text())
        .then(result => alert(JSON.parse(result).body))
        .catch(error => console.log('error', error));
    }
  </script>
</head>
<body>
  <form>
    <label>First Name:</label>
    <input type="text" id="firstName" name="firstName"><br><br>
    <label>Last Name:</label>
    <input type="text" id="lastName" name="lastName"><br><br>
    <input type="button" value="Submit" onclick="callAPI(document.getElementById('firstName').value, document.getElementById('lastName').value)">
  </form>
</body>
